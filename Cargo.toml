[package]
name = "speakrs-cli"
version = "0.1.0"
edition = "2024"

[dependencies]
speakrs = { path = "vendor/speakrs", features = ["load-dynamic", "migraphx", "cuda"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hound = "3"
libloading = "0.8"
ort = { version = "2.0.0-rc.12", features = ["load-dynamic", "migraphx", "cuda"] }

[profile.release]
opt-level = 3
lto = true
